version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trafficflow-postgres
    restart: always
    environment:
      POSTGRES_DB: trafficflow
      POSTGRES_USER: traffic_admin
      POSTGRES_PASSWORD: traffic_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_admin -d trafficflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: trafficflow-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trafficflow-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://postgres:5432/trafficflow
      - DB_DRIVER=org.postgresql.Driver
      - DB_USERNAME=traffic_admin
      - DB_PASSWORD=traffic_secret_2026
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - SIMULATION_ENABLED=true
      - SIMULATION_INTERVAL=30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trafficflow-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
