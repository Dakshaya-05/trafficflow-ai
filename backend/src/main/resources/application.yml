server:
  port: ${PORT:8080}

spring:
  application:
    name: trafficflow-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trafficflow}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

ml:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://*.onrender.com}

simulation:
  enabled: ${SIMULATION_ENABLED:true}
  interval-seconds: ${SIMULATION_INTERVAL:30}

---
# H2 In-Memory Profile for automated testing or fallback
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:trafficflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
