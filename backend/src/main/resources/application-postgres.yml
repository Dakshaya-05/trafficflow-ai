spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trafficflow}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:traffic_admin}
    password: ${DB_PASSWORD:traffic_secret_2026}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
