# ==============================================================================
# Render Blueprint Specification for TrafficFlow AI
# 1-Click Zero-Configuration Deployment: Free Cloud Database + Python AI + Spring Boot Backend
# ==============================================================================

databases:
  - name: trafficflow-db
    databaseName: trafficflow
    user: trafficflow_user
    plan: free
    region: oregon

services:
  # 1. Python AI Prediction Service (FastAPI + Random Forest)
  - type: web
    name: trafficflow-ai-service
    runtime: docker
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

  # 2. Java Spring Boot Backend (Java 21 + MySQL / PostgreSQL + Spring Security)
  - type: web
    name: trafficflow-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        fromDatabase:
          name: trafficflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: http://trafficflow-ai-service:10000
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
